<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>OWM Frontend</title>
    <script>
      // Applies a saved theme before the first paint. Without this the page renders in the OS
      // theme for a frame before React can stamp an explicit choice, which reads as a flash.
      // The key must stay in step with THEME_STORAGE_KEY in shared/hooks/use-theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('owm.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (error) {
          /* Storage can throw in private mode; the OS preference is a fine fallback. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
