<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Installed-app metadata for iOS. The manifest link is injected at build time by
      vite-plugin-pwa and covers Android on its own, but Safari reads almost none of the manifest:
      without these three lines "Add to Home Screen" saves a screenshot as the icon and reopens the
      site in a browser tab, which is the thing installing was meant to avoid.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OWM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Colours the address bar on Android, and the status bar once installed. Matches
         theme_color in the manifest and the accent token in app/styles/globals.css. -->
    <meta name="theme-color" content="#1a52c4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      The name the product goes by, not the name of the repository. This is what a browser tab, a
      bookmark and a shared link all show, and "OWM Frontend" described the codebase to the one
      audience that never sees it.
    -->
    <title>KBiz360 OWM</title>
    <meta
      name="description"
      content="Owners Wealth Management — accounting books, statements and reports."
    />
    <script>
      // Applies a saved theme before the first paint. Without this the page renders in the OS
      // theme for a frame before React can stamp an explicit choice, which reads as a flash.
      // The key must stay in step with THEME_STORAGE_KEY in shared/hooks/use-theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('owm.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (error) {
          /* Storage can throw in private mode; the OS preference is a fine fallback. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
