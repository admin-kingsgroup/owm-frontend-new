name: CI / Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  # Never cancel a deploy that is already rsyncing. A run killed between the asset prune and the
  # index.html swap leaves index.html pointing at a bundle that is no longer on the box, which
  # serves every visitor a blank page until the next deploy. Queue instead.
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  REMOTE_DIR: /var/www/owm-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc -b && vite build)
        env:
          # relative by default → same-origin through nginx; override with a repo variable if the API moves.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
        run: |
          npm run build
          test -f dist/index.html

      - name: Unit tests
        run: npm test

      # ---------- browser checks, which need the backend beside this repo ----------
      #
      # These are the only checks that see a drawn page: an overflowing statement, a strip off the
      # edge, a screen that throws once it has real data. Everything above them passes on a build
      # that renders nothing. They run before the deploy steps so a failure stops the release.
      - name: Check browser-check prerequisites
        id: e2e
        env:
          K: ${{ secrets.BACKEND_DEPLOY_KEY }}
        run: |
          if [ -n "$K" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BACKEND_DEPLOY_KEY not set - browser checks skipped, deploy continues."
          fi

      - name: Check out the backend
        if: steps.e2e.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is scoped to this repository alone, so reaching the backend needs a
          # credential of its own. A read-only deploy key rather than a personal token: it opens
          # exactly one repository and nothing else the account can reach.
          repository: ${{ vars.BACKEND_REPO || 'admin-kingsgroup/owm-backend-new' }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          # checkout may only write inside the workspace; the step below moves it where the
          # harness resolves it from — `../OWM-ADB Backend`, as playwright.config.ts expects.
          path: .backend

      - name: Put the backend where the harness looks for it
        if: steps.e2e.outputs.ready == 'true'
        run: |
          rm -rf "../OWM-ADB Backend"
          mv .backend "../OWM-ADB Backend"
          cd "../OWM-ADB Backend"
          npm ci

      # The harness gives the API an in-memory replica set, and mongodb-memory-server downloads a
      # mongod the first time it does. Same cache as the backend's own workflow.
      - name: Cache the mongod the harness downloads
        if: steps.e2e.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}

      # The browser is a ~130MB download on every run without this. Keyed on the Playwright
      # version, so a bump fetches the matching build instead of reusing the old one.
      - name: Cache Chromium
        if: steps.e2e.outputs.ready == 'true'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.e2e.outputs.ready == 'true'
        # --with-deps every time: the system libraries live outside the cached directory, so a
        # cache hit still leaves a browser that cannot start without them.
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        if: steps.e2e.outputs.ready == 'true'
        # The harness starts both servers itself and gives the API a throwaway in-memory replica
        # set, so there is no database or credential for CI to hold.
        run: npm run e2e

      # The committed baselines are the Linux set, and this is where that set comes from: a screen
      # CI has never captured is written on the run that first sees it, and uploaded here to be
      # committed once. The same artifact carries the refreshed set after a deliberate UI change.
      - name: Publish the visual baselines
        if: always() && steps.e2e.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/screens.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep what the browser checks saw
        # `always()`, because the screenshots and traces are worth most on the run that failed.
        if: always() && steps.e2e.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            e2e/screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # ---------- everything below only runs once EC2 secrets exist ----------
      - name: Check deploy secrets
        id: cfg
        env:
          H: ${{ secrets.EC2_HOST }}
          U: ${{ secrets.EC2_USER }}
          K: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$K" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2_HOST / EC2_USER / EC2_SSH_KEY not set — build succeeded, deploy skipped."
          fi

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Rsync dist/ to EC2 (assets first, index.html next, prune last)"
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          # 1) new hashed assets land next to the old ones — the old index.html stays valid.
          rsync -az -e "$SSH" --exclude 'index.html' dist/ "$USER@$HOST:$REMOTE_DIR/"
          # 2) swap the entrypoint on its own. Its bundle is already on the box from step 1, so
          #    there is no window in which index.html names an asset that is not there.
          rsync -az -e "$SSH" --include 'index.html' --exclude '*' dist/ "$USER@$HOST:$REMOTE_DIR/"
          # 3) only now prune what the new build no longer references. --delete-after holds every
          #    deletion until the transfers succeed, so a failure here removes nothing.
          rsync -az --delete-after -e "$SSH" dist/ "$USER@$HOST:$REMOTE_DIR/"

      - name: Smoke test (through nginx, follows http→https redirect)
        if: steps.cfg.outputs.ready == 'true'
        env:
          # SITE_URL repo variable (e.g. https://kbizowm.duckdns.org) wins; else http://<EC2_HOST>
          SITE_URL: ${{ vars.SITE_URL || format('http://{0}', secrets.EC2_HOST) }}
        run: |
          html=$(curl -fsSL --max-time 20 "$SITE_URL/")
          echo "$html" | grep -qi '<div id="root"' && echo "frontend OK"
          # Every asset index.html names must actually be served. This is the check that catches a
          # half-finished deploy: the page returns 200 while its bundle 404s, and the app never boots.
          assets=$(echo "$html" | grep -oE '/assets/[A-Za-z0-9._-]+' | sort -u)
          [ -n "$assets" ] || { echo "no /assets/* referenced by index.html"; exit 1; }
          for a in $assets; do
            code=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$SITE_URL$a")
            echo "asset $a $code"; [ "$code" = "200" ] || exit 1
          done
          # deep link must fall back to index.html (BrowserRouter)
          code=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$SITE_URL/some/deep/route")
          echo "deep-link $code"; [ "$code" = "200" ]
